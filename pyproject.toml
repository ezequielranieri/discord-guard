[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-guard"
version = "0.1.0"
description = "CLI tool to detect and protect against Discord session token hijacking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Ezequiel Ranieri", email = "ez.ranieri@gmail.com" },
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "reportlab>=4.2.0",
]

[project.scripts]
discord-guard = "guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guard"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"
asyncio_mode = "auto"
